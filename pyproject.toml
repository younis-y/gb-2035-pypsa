[project]
name = "gb2035"
version = "0.1.0"
description = "Least-cost GB power system in 2035 under carbon caps, with a Teesside hydrogen node, in PyPSA"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Younis Younis" }]
dependencies = [
    "pypsa>=1.3",
    "linopy>=0.9",
    "highspy>=1.15",
    "pandas>=3.0",
    "numpy>=2.0",
    "xarray>=2025.1",
    "netcdf4>=1.7",
    "geopandas>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "pydantic>=2.11",
    "typer>=0.15",
    "rich>=13.9",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
profiles = ["atlite>=0.6"]
app = ["streamlit>=1.45", "plotly>=5.24"]
workflow = ["snakemake>=9.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "pandas-stubs",
    "kaleido>=1.0",
    "types-PyYAML",
    "types-openpyxl",
    "pre-commit>=4.0",
    "pulp>=2.9",
]

[project.scripts]
gb2035 = "gb2035.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb2035"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PTH", "RET", "TID"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
"workflow/*" = ["ANN", "E501", "F821"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "slow: takes more than ten seconds",
    "network: needs internet access",
]
# PyPSA 1.3 coerces pandas 3.0 string columns back to object dtype on every `add` and warns
# about it. Nothing in this project can act on it; ignore that one message only.
# pulp 3.x's own API (LpVariable.dicts, PULP_CBC_CMD) is deprecated ahead of PuLP 4.0; the
# battery-reproduction test uses that API verbatim, so ignore pulp's own deprecation noise.
# xarray's netCDF4 backend assigns into an ndarray's `.shape` when writing/reading `.nc` files,
# a pattern NumPy 2.5 deprecates; nothing in this project can act on it upstream.
# xarray probes every optional backend (including cfgrib, for GRIB files this project never
# reads) when it first opens a `.nc` file; the runner has no system ecCodes library, so the probe
# warns. Nothing in this project can act on it.
filterwarnings = [
    "ignore:pandas infers the `str` dtype for string data:FutureWarning",
    "ignore::DeprecationWarning:pulp",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Engine 'cfgrib' loading failed:RuntimeWarning",
]
