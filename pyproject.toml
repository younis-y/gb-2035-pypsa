[project]
name = "gb2035"
version = "0.1.0"
description = "Least-cost GB power system in 2035 under carbon caps, with a Teesside hydrogen node, in PyPSA"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Younis Younis" }]
dependencies = [
    "pypsa>=1.3",
    "linopy>=0.9",
    "highspy>=1.15",
    "pandas>=3.0",
    "numpy>=2.0",
    "xarray>=2025.1",
    "netcdf4>=1.7",
    "geopandas>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "pydantic>=2.11",
    "typer>=0.15",
    "rich>=13.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
profiles = ["atlite>=0.6"]
app = ["streamlit>=1.45", "folium>=0.19", "streamlit-folium>=0.23", "plotly>=5.24"]
workflow = ["snakemake>=9.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "pandas-stubs",
    "types-PyYAML",
    "types-openpyxl",
    "pre-commit>=4.0",
    "pulp>=2.9",
]

[project.scripts]
gb2035 = "gb2035.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb2035"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PTH", "RET", "TID"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
"workflow/*" = ["ANN", "E501", "F821"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "slow: takes more than ten seconds",
    "network: needs internet access",
]
